name: Deploy to Cloudflare Pages

# Production deploy on every push to main; preview deploy for every pull
# request, with the preview URL posted as a PR comment. Both jobs upload the
# repository root as-is (no build step; see wrangler.toml).
#
# Required repository secrets (see DEPLOY.md):
#   CLOUDFLARE_API_TOKEN   token with Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the Pages project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: sengol-website

jobs:
  production:
    name: Production deploy (sengol.io)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sengol.io
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Summary
        run: |
          {
            echo "## Production deploy"
            echo
            echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Live site: https://sengol.io"
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref }} --commit-dirty=true

      - name: Comment preview URL on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const { DEPLOYMENT_URL, ALIAS_URL, HEAD_SHA } = process.env;
            const lines = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `| | |`,
              `|---|---|`,
              `| Commit | \`${HEAD_SHA.slice(0, 7)}\` |`,
              `| Preview | ${DEPLOYMENT_URL || '(no URL returned)'} |`,
            ];
            if (ALIAS_URL && ALIAS_URL !== DEPLOYMENT_URL) {
              lines.push(`| Branch alias | ${ALIAS_URL} |`);
            }
            lines.push('', 'Updated on every push to this pull request.');
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
