# Cloudflare Pages configuration for sengol.io.
#
# The site is plain HTML/CSS with no build step, so the repository root is the
# deploy directory. Response headers live in `_headers`; keep that file as the
# single source of header rules. There is no `_redirects` file because nothing
# on the site needs one.
#
# Deploys happen through Cloudflare's Git integration (the Cloudflare Pages
# GitHub App watches this repo and deploys every push to main). Because this
# file contains `pages_build_output_dir`, Cloudflare reads it on every Git
# build and treats it as the source of truth for the settings it defines,
# overriding the dashboard. `wrangler pages deploy` reads it too for a manual
# deploy from a laptop. See DEPLOY.md.

name = "sengol-website"
pages_build_output_dir = "."
